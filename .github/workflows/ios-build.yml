name: iOS build check

# Проверка iOS-сборки на macOS. Запускается ВРУЧНУЮ (кнопка Run workflow),
# чтобы не присылать письма о падениях при каждом изменении кода.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Доступ к приватному модулю кодов
        run: git config --global url."https://x-access-token:${{ secrets.GH_MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Версия Flutter
        run: flutter --version
      - name: Зависимости
        run: flutter pub get
      - name: Установка модулей iOS
        run: cd ios && pod install --repo-update
      - name: Сборка iOS без подписи
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=CODE_KEY=${{ secrets.CODE_KEY }}
